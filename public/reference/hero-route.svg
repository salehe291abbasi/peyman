<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f5f6"/>
      <stop offset="1" stop-color="#f4f8fb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14a0aa"/>
      <stop offset="1" stop-color="#0b5b7a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8e7ea"/>
      <stop offset="1" stop-color="#e7f4f5"/>
    </linearGradient>
  </defs>
    <circle cx="640" cy="130" r="74" fill="#f2a33a" opacity=".18"/>
  <path d="M0 470 C 140 400, 260 430, 400 390 S 660 330, 800 360 V640 H0Z" fill="url(#hill)"/>
  <path d="M0 540 C 180 500, 320 540, 470 500 S 700 470, 800 490 V640 H0Z" fill="#b5dde1" opacity=".7"/>
  <!-- route -->
  <path d="M90 470 C 170 400, 250 300, 360 300 S 520 220, 600 190 S 700 150, 720 130" stroke="url(#road)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M90 470 C 170 400, 250 300, 360 300 S 520 220, 600 190 S 700 150, 720 130" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2 14" stroke-linecap="round" fill="none" opacity=".85"/>
  <!-- stops -->
  <g>
    <circle cx="90" cy="470" r="14" fill="#fff" stroke="#0e7c86" stroke-width="5"/>
    <circle cx="360" cy="300" r="14" fill="#fff" stroke="#0e7c86" stroke-width="5"/>
    <circle cx="600" cy="190" r="14" fill="#fff" stroke="#0e7c86" stroke-width="5"/>
  </g>
  <!-- destination pin -->
  <g transform="translate(720 92)">
    <path d="M0 52 C -24 22, -34 6, -34 -10 A 34 34 0 1 1 34 -10 C 34 6, 24 22, 0 52Z" fill="#0e7c86"/>
    <circle cx="0" cy="-10" r="12" fill="#fff"/>
  </g>
  <!-- bus -->
  <g transform="translate(300 232)">
    <rect x="0" y="0" width="120" height="66" rx="14" fill="#0c1a2c"/>
    <rect x="12" y="12" width="36" height="22" rx="5" fill="#8fd6dc"/>
    <rect x="54" y="12" width="32" height="22" rx="5" fill="#8fd6dc"/>
    <rect x="92" y="12" width="18" height="22" rx="5" fill="#8fd6dc"/>
    <rect x="10" y="44" width="100" height="6" rx="3" fill="#f2a33a"/>
    <circle cx="30" cy="70" r="11" fill="#0c1a2c" stroke="#fff" stroke-width="5"/>
    <circle cx="92" cy="70" r="11" fill="#0c1a2c" stroke="#fff" stroke-width="5"/>
  </g>
  <!-- document card -->
  <g transform="translate(120 110)">
    <rect width="150" height="104" rx="16" fill="#fff" stroke="#e3e8f0" stroke-width="2"/>
    <rect x="18" y="22" width="90" height="10" rx="5" fill="#0e7c86"/>
    <rect x="18" y="44" width="110" height="7" rx="3.5" fill="#cdd5e3"/>
    <rect x="18" y="60" width="80" height="7" rx="3.5" fill="#cdd5e3"/>
    <circle cx="122" cy="82" r="13" fill="#e3f5ea"/>
    <path d="M115 82 l5 5 l9 -10" stroke="#22a455" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- consent chip -->
  <g transform="translate(470 420)">
    <rect width="196" height="60" rx="30" fill="#fff" stroke="#e3e8f0" stroke-width="2"/>
    <circle cx="34" cy="30" r="16" fill="#f2a33a"/>
    <path d="M27 30 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="62" y="18" width="110" height="9" rx="4.5" fill="#0f1b33"/>
    <rect x="62" y="34" width="72" height="7" rx="3.5" fill="#cdd5e3"/>
  </g>
